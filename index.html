<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 성향 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        /* 기본 레이아웃 스타일 및 그라데이션 아래서 위로 변경 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(to top, #02076d 0%, #1c03e1 50%, #000000 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 상단 배너 영역 완벽 중앙 정렬 및 가로 길이 보완 */
        .banner-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;    
            justify-content: center;
            text-align: center;
            margin-bottom: 30px;
            gap: 12px;
        }

        .banner-bar {
            display: inline-flex;   
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 32px;    
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        /* 글래스모피즘 공통 박스 스타일 */
        .glass-box {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            width: 100%;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        /* 메인 홈 / 질문지 레이아웃 제어 */
        .page {
            display: none;
            width: 100%;
        }

        .page.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 질문 번호 스타일링 피드백 반영 (#7dfd57) */
        .question-number {
            color: #7dfd57;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 12px;
            text-align: center;
            width: 100%;
        }

        /* 질문 텍스트 내 예시들 볼드체 제거 및 줄바꿈 유연성 반영 */
        .question-text {
            font-size: 1.15rem;
            line-height: 1.65;
            text-align: center;
            font-weight: 400; 
            word-break: keep-all;
        }

        .answer-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }

        /* 답안 선택지 글래스 효과 유지 + 개별 호버 테두리 */
        .answer-btn {
            width: 100%;
            text-align: left;
            padding: 18px 24px;
            font-size: 1rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        /* 1번째 답안 호버 효과 (#7dfd57 라임그린) */
        .answer-btn.hover-0:hover {
            border-color: #7dfd57 !important;
            background: rgba(125, 253, 87, 0.08) !important;
            box-shadow: 0 0 16px rgba(125, 253, 87, 0.25);
            transform: translateY(-2px);
        }

        /* 2번째 답안 호버 효과 (#1c03e1 비비드블루) */
        .answer-btn.hover-1:hover {
            border-color: #1c03e1 !important;
            background: rgba(28, 3, 225, 0.12) !important;
            box-shadow: 0 0 16px rgba(28, 3, 225, 0.3);
            transform: translateY(-2px);
        }

        /* 3번째 답안 호버 효과 (#02076d 딥네이비) */
        .answer-btn.hover-2:hover {
            border-color: #02076d !important;
            background: rgba(2, 7, 109, 0.25) !important;
            box-shadow: 0 0 16px rgba(2, 7, 109, 0.4);
            transform: translateY(-2px);
        }

        /* 메인 시작 버튼 스타일 */
        .btn-primary {
            background: #ff003c;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(255, 0, 60, 0.4);
        }

        .btn-primary:hover {
            background: #e60035;
            transform: scale(1.03);
        }

        /* 하단 파트너 푸터 스타일 영역 */
        footer {
            width: 100%;
            background: #000000;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin-top: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        footer img {
            height: 30px;
            object-fit: contain;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        footer img:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="banner-container">
            <div class="banner-bar">🍱 오늘의 메뉴</div>
            <div class="banner-bar">🔳 큐브</div>
            <div class="banner-bar">📋 메뉴 유형란</div>
        </div>

        <div id="home-page" class="page active">
            <div class="glass-box" style="text-align: center; padding: 40px 20px;">
                <h2 style="font-size: 1.8rem; margin-bottom: 16px;">나의 특별한 게임 성향 테스트</h2>
                <p style="opacity: 0.8; margin-bottom: 30px; line-height: 1.5;">몇 가지 간단한 질문을 통해 당신만의 플레이 스타일과 그에 어울리는 최적의 메뉴를 매칭해 드립니다.</p>
                <button class="btn-primary" onclick="startTest()">테스트 시작하기</button>
            </div>
        </div>

        <div id="test-page" class="page">
            <div class="glass-box">
                <div id="question-num" class="question-number">질문 1</div>
                <div id="question-txt" class="question-text"></div>
            </div>
            <div id="answer-container" class="answer-container"></div>
        </div>

        <div id="result-page" class="page">
            <div class="glass-box" style="text-align: center;">
                <h3 style="color: #7dfd57; font-size: 1.4rem; margin-bottom: 10px;">분석 완료!</h3>
                <h2 id="result-type" style="font-size: 2rem; margin-bottom: 20px; color: #ffffff;">유형 로딩중...</h2>
                <p id="result-desc" style="line-height: 1.6; opacity: 0.9; margin-bottom: 20px;">성향 상세 분석 정보가 출력됩니다.</p>
            </div>
            <button class="btn-primary" onclick="location.reload()" style="margin-bottom: 40px;">다시 테스트하기</button>
        </div>
    </div>

    <footer>
        <img src="logo-cube.png" alt="큐브">
        <img src="logo-qchamps.png" alt="큐챔스">
        <img src="logo-zowie.png" alt="조위">
    </footer>

    <script>
        // 수파베이스 초기화 설정
        const SUPABASE_URL = "https://mtsxunvkpzqbdlskjzpx.supabase.co";
        const SUPABASE_KEY = "sb_publishable__LUtSxMRcyxxwa7rrVO-vQ_ouhka_XX"; 
        const supabase = bootstrapSupabase();

        function bootstrapSupabase() {
            if (typeof supabase !== 'undefined') return supabase;
            return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // [구조 보완] 질문 데이터 작성 시 원하는 줄바꿈 위치에 \n 을 입력해주시면 코드가 자동으로 캐치하여 구역을 나눕니다.
        const questions = [
            {
                qNum: 1,
                title: "질문 1",
                text: "새로운 랭킹 시즌이 열리고 친구들과 경쟁이 시작된 상황이다.\n당신의 반응은?",
                answers: [
                    "화려한 그래픽과 세계관을 탐험하며 숨겨진 재미 요소 찾기",
                    "시스템 효율성을 극대화하여 가장 빠르게 랭킹 상위권 진입하기",
                    "커뮤니티 채널에 가입하여 함께 즐길 파티원 탐색하기"
                ]
            },
            {
                qNum: 2,
                title: "질문 2",
                text: "중요한 토너먼트 결승전 시합 도중 아군이 결정적인 실수를 저질렀다.\n당신의 선택은?",
                answers: [
                    "괜찮다고 격려하며 다음 빌드나 조합을 빠르게 맞춰나간다",
                    "어떤 부분에서 피드백이 꼬였는지 이성적으로 원인을 분석한다",
                    "분위기가 무거워지지 않도록 유쾌한 농담으로 멘탈을 케어한다"
                ]
            }
        ];

        let currentIdx = 0;
        let selections = [];

        function startTest() {
            document.getElementById("home-page").classList.remove("active");
            document.getElementById("test-page").classList.add("active");
            showQuestion();
        }

        // 질문 렌더링 함수 - 한 줄 엔터(구역 분리) 반영 자동화 및 호버 매핑
        function showQuestion() {
            const currentQ = questions[currentIdx];
            document.getElementById("question-num").innerText = currentQ.title;
            
            // 데이터 속 \n 기호를 브라우저 줄바꿈 태그(<br>)로 치환하여 깔끔히 구역을 분할해 출력합니다.
            const formattedText = currentQ.text.replace(/\n/g, "<br>");
            document.getElementById("question-txt").innerHTML = formattedText;

            const container = document.getElementById("answer-container");
            container.innerHTML = ""; 

            currentQ.answers.forEach((ansText, index) => {
                const btn = document.createElement("button");
                btn.className = `answer-btn hover-${index}`;
                btn.innerText = ansText;
                btn.onclick = () => selectAnswer(index);
                container.appendChild(btn);
            });
        }

        function selectAnswer(chosenIdx) {
            selections.push(chosenIdx);
            currentIdx++;

            if (currentIdx < questions.length) {
                showQuestion();
            } else {
                submitAndResult();
            }
        }

        async function submitAndResult() {
            document.getElementById("test-page").classList.remove("active");
            document.getElementById("result-page").classList.add("active");

            const typeScore = selections.reduce((a, b) => a + b, 0);
            let finalType = "🍓 딸기 스무디형 플레이어";
            let finalDesc = "주변 사람들을 편안하게 만들고 소통과 협동을 중요하게 생각하는 다정다감한 스타일입니다.";

            if (typeScore <= 1) {
                finalType = "🫐 블루레몬 에이드형 플레이어";
                finalDesc = "톡톡 튀는 개성과 새로운 즐거움을 즐기며 끊임없이 도전하는 모험가 스타일입니다.";
            } else if (typeScore >= 3) {
                finalType = "🍗 순살치킨형 플레이어";
                finalDesc = "혼자보다 함께일 때 강력한 시너지를 내며 단합과 승리를 쟁취하는 리더 스타일입니다.";
            }

            document.getElementById("result-type").innerText = finalType;
            document.getElementById("result-desc").innerText = finalDesc;

            try {
                await supabase.from("test_results").insert([
                    { 
                        gender: Math.random() > 0.5 ? "무작위(남)" : "무작위(여)", 
                        result_type: finalType 
                    }
                ]);
                console.log("데이터 수집 성공");
            } catch (err) {
                console.error("오류 발생:", err);
            }
        }
    </script>
</body>
</html>
